<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lapor Terlambat — Sistem Absensi Madrasah</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body {
      background: linear-gradient(180deg, var(--teal-deep) 0%, var(--teal-deep) 30%, var(--sand) 30%);
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
    }
    .box {
      width: 100%;
      max-width: 440px;
      margin-top: 24px;
    }
    .box .brand {
      color: #F4EFDF;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }
    .box .sub {
      color: #C7D6D0;
      font-size: 13.5px;
      text-align: center;
      margin-bottom: 22px;
    }
    .card-form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 26px 24px;
      box-shadow: 0 12px 30px rgba(23,66,59,0.16);
    }
    .card-form h2 {
      font-size: 18px;
      margin: 0 0 4px 0;
      color: var(--teal-deep);
    }
    .card-form .desc {
      font-size: 13px;
      color: #6E7D79;
      margin-bottom: 20px;
    }
    .field-full { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .field-full label { font-size: 12.5px; font-weight: 600; color: #47605A; }
    .field-full select,
    .field-full input,
    .field-full textarea {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #FEFDFB;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      width: 100%;
    }
    .field-full textarea { resize: vertical; min-height: 72px; }
    .field-full select:focus, .field-full input:focus, .field-full textarea:focus {
      outline: 2px solid var(--gold-soft);
      outline-offset: 1px;
      border-color: var(--gold);
    }
    .btn-submit {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      font-size: 14.5px;
    }
    .sukses {
      text-align: center;
      padding: 20px 4px;
    }
    .sukses .icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #E3F1E9;
      color: var(--hadir);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px auto;
    }
    .sukses h2 { color: var(--teal-deep); margin-bottom: 6px; }
    .sukses p { color: #5B6B67; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="brand">Al-Hikmah</div>
      <div class="sub">Formulir Lapor Terlambat</div>

      <div class="card-form" id="card-form">
        <h2>Catat Keterlambatan</h2>
        <div class="desc">Isi data berikut dengan jujur. Data akan langsung tercatat di sistem absensi madrasah.</div>

        <div id="msg"></div>

        <form id="form-terlambat">
          <div class="field-full" id="wrap-kampus" style="display:none;">
            <label for="f-kampus">Kampus</label>
            <select id="f-kampus" required></select>
          </div>

          <div class="field-full">
            <label for="f-kelas">Kelas</label>
            <select id="f-kelas" required disabled>
              <option value="">Pilih kampus dahulu</option>
            </select>
          </div>

          <div class="field-full">
            <label for="f-siswa">Nama Siswa</label>
            <select id="f-siswa" required disabled>
              <option value="">Pilih kelas dahulu</option>
            </select>
          </div>

          <div class="field-full">
            <label for="f-jam">Jam Tiba di Madrasah</label>
            <input type="time" id="f-jam" required />
          </div>

          <div class="field-full">
            <label for="f-alasan">Alasan Keterlambatan</label>
            <textarea id="f-alasan" required placeholder="Contoh: Bangun kesiangan, ban motor bocor, dsb."></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-submit">Kirim Laporan</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function nowTimeValue() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    async function muatKelas(kampusId) {
      const selKelas = document.getElementById("f-kelas");
      const selSiswa = document.getElementById("f-siswa");
      selKelas.disabled = true;
      selSiswa.disabled = true;
      selSiswa.innerHTML = `<option value="">Pilih kelas dahulu</option>`;
      if (!kampusId) {
        selKelas.innerHTML = `<option value="">Pilih kampus dahulu</option>`;
        return;
      }
      selKelas.innerHTML = `<option value="">Memuat...</option>`;
      const rows = await api(`/api/public/kelas?kampus_id=${kampusId}`);
      selKelas.innerHTML =
        `<option value="">Pilih kelas</option>` +
        rows.map((k) => `<option value="${k.id}">${k.nama_kelas}</option>`).join("");
      selKelas.disabled = false;
    }

    async function muatSiswa(kelasId) {
      const selSiswa = document.getElementById("f-siswa");
      if (!kelasId) {
        selSiswa.innerHTML = `<option value="">Pilih kelas dahulu</option>`;
        selSiswa.disabled = true;
        return;
      }
      selSiswa.innerHTML = `<option value="">Memuat...</option>`;
      const rows = await api(`/api/public/siswa?kelas_id=${kelasId}`);
      selSiswa.innerHTML =
        `<option value="">Pilih nama Anda</option>` +
        rows.map((s) => `<option value="${s.id}">${s.nama} (${s.nis})</option>`).join("");
      selSiswa.disabled = false;
    }

    (async () => {
      document.getElementById("f-jam").value = nowTimeValue();

      const params = new URLSearchParams(window.location.search);
      const kampusIdDariUrl = params.get("kampus_id");

      if (kampusIdDariUrl) {
        // QR code sudah spesifik per kampus — tidak perlu tampilkan pilihan kampus
        await muatKelas(kampusIdDariUrl);
      } else {
        // Tampilkan pilihan kampus jika halaman dibuka tanpa parameter
        document.getElementById("wrap-kampus").style.display = "flex";
        const kampusList = await api("/api/public/kampus");
        document.getElementById("f-kampus").innerHTML =
          `<option value="">Pilih kampus</option>` +
          kampusList.map((k) => `<option value="${k.id}">${k.nama_kampus}</option>`).join("");
        document.getElementById("f-kampus").addEventListener("change", (e) => {
          muatKelas(e.target.value);
        });
      }

      document.getElementById("f-kelas").addEventListener("change", (e) => {
        muatSiswa(e.target.value);
      });

      document.getElementById("form-terlambat").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        msg.innerHTML = "";
        const siswaId = document.getElementById("f-siswa").value;
        const jam = document.getElementById("f-jam").value;
        const alasan = document.getElementById("f-alasan").value.trim();

        if (!siswaId) {
          msg.innerHTML = `<div class="msg msg-error">Pilih nama Anda terlebih dahulu.</div>`;
          return;
        }

        try {
          const r = await api("/api/public/lapor-terlambat", {
            method: "POST",
            body: JSON.stringify({ siswa_id: siswaId, alasan, jam_datang: jam }),
          });
          document.getElementById("card-form").innerHTML = `
            <div class="sukses">
              <div class="icon">✓</div>
              <h2>Laporan Tersimpan</h2>
              <p>
                Terima kasih, <strong>${r.nama}</strong> (${r.nama_kelas} — ${r.nama_kampus})<br/>
                tercatat <strong>terlambat</strong> pada ${fmtTanggal(r.tanggal)}.<br/><br/>
                Silakan langsung menuju kelas.
              </p>
            </div>`;
        } catch (err) {
          msg.innerHTML = `<div class="msg msg-error">${err.message}</div>`;
        }
      });
    })();
  </script>
</body>
</html>
