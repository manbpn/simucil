<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akun Pengguna — Sistem Absensi Madrasah</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h1>Akun Pengguna</h1>
        <p>Kelola akun Admin (per kampus), Guru Piket, dan Super Admin.</p>
      </div>

      <div id="akses-ditolak" style="display:none;" class="msg msg-error">
        Halaman ini khusus untuk Super Admin.
      </div>

      <div id="konten" style="display:none;">
        <div class="card">
          <h2>Tambah akun</h2>
          <div id="msg"></div>
          <form id="form-akun" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
            <div class="field">
              <label for="u-username">Nama pengguna</label>
              <input type="text" id="u-username" required />
            </div>
            <div class="field">
              <label for="u-password">Kata sandi</label>
              <input type="password" id="u-password" required />
            </div>
            <div class="field">
              <label for="u-nama">Nama lengkap</label>
              <input type="text" id="u-nama" required style="min-width:200px;" />
            </div>
            <div class="field">
              <label for="u-role">Peran</label>
              <select id="u-role">
                <option value="admin">Admin</option>
                <option value="guru_piket">Guru Piket</option>
                <option value="super_admin">Super Admin</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Buat akun</button>
          </form>

          <div id="pilih-kampus-wrap" style="margin-top:14px;">
            <label style="font-size:12.5px; font-weight:600; color:#47605A; display:block; margin-bottom:8px;">
              Kampus yang menjadi tanggung jawab akun Admin ini
            </label>
            <div id="pilih-kampus" style="display:flex; gap:16px; flex-wrap:wrap;"></div>
          </div>
        </div>

        <div class="card">
          <h2>Daftar akun</h2>
          <div id="tabel-akun"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let daftarKampus = [];

    function renderPilihKampus(terpilih = []) {
      document.getElementById("pilih-kampus").innerHTML = daftarKampus
        .map(
          (k) => `
        <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:normal;">
          <input type="checkbox" class="chk-kampus" value="${k.id}" ${terpilih.includes(k.id) ? "checked" : ""} />
          ${k.nama_kampus}
        </label>`
        )
        .join("");
    }

    function toggleKampusWrap() {
      const role = document.getElementById("u-role").value;
      document.getElementById("pilih-kampus-wrap").style.display = role === "admin" ? "block" : "none";
    }

    async function muatAkun() {
      const rows = await api("/api/users");
      const wrap = document.getElementById("tabel-akun");
      wrap.innerHTML = `
        <table>
          <thead><tr><th>Nama Pengguna</th><th>Nama Lengkap</th><th>Peran</th><th>Kampus</th><th></th></tr></thead>
          <tbody>
            ${rows
              .map((u) => {
                const roleLabel = u.role === "super_admin" ? "Super Admin" : u.role === "guru_piket" ? "Guru Piket" : "Admin";
                const kampusText = u.kampus ? u.kampus.map((k) => k.nama_kampus).join(", ") : "-";
                return `<tr>
                  <td>${u.username}</td>
                  <td>${u.nama}</td>
                  <td><span class="tag-role tag-${u.role}">${roleLabel}</span></td>
                  <td>${kampusText}</td>
                  <td style="display:flex; gap:6px;">
                    ${
                      u.role === "admin"
                        ? `<button class="btn btn-outline" data-ubah-kampus="${u.id}" data-kampus-sekarang='${JSON.stringify((u.kampus || []).map((k) => k.id))}' style="padding:5px 10px; font-size:12.5px;">Ubah Kampus</button>`
                        : ""
                    }
                    <button class="btn btn-danger" data-hapus="${u.id}" style="padding:5px 10px; font-size:12.5px;">Hapus</button>
                  </td>
                </tr>`;
              })
              .join("")}
          </tbody>
        </table>`;

      wrap.querySelectorAll("[data-hapus]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Hapus akun ini?")) return;
          try {
            await api(`/api/users/${btn.dataset.hapus}`, { method: "DELETE" });
            muatAkun();
          } catch (err) {
            alert(err.message);
          }
        });
      });

      wrap.querySelectorAll("[data-ubah-kampus]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const userId = btn.dataset.ubahKampus;
          const sekarang = JSON.parse(btn.dataset.kampusSekarang);
          const daftar = daftarKampus.map((k) => `${k.id}: ${k.nama_kampus}`).join("\n");
          const input = prompt(
            `Masukkan ID kampus (pisahkan koma) untuk akun ini.\n\nDaftar kampus:\n${daftar}\n\nKampus saat ini: ${sekarang.join(", ")}`,
            sekarang.join(",")
          );
          if (input === null) return;
          const kampus_ids = input
            .split(",")
            .map((s) => Number(s.trim()))
            .filter((n) => !isNaN(n));
          if (kampus_ids.length === 0) {
            alert("Minimal pilih 1 kampus.");
            return;
          }
          try {
            await api(`/api/users/${userId}/kampus`, {
              method: "PUT",
              body: JSON.stringify({ kampus_ids }),
            });
            muatAkun();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    }

    (async () => {
      const me = await initShell("/app/akun.html");
      if (!me) return;

      if (me.role !== "super_admin") {
        document.getElementById("akses-ditolak").style.display = "block";
        return;
      }
      document.getElementById("konten").style.display = "block";

      daftarKampus = await api("/api/kampus");
      renderPilihKampus();
      toggleKampusWrap();

      document.getElementById("u-role").addEventListener("change", toggleKampusWrap);

      document.getElementById("form-akun").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        msg.innerHTML = "";
        const role = document.getElementById("u-role").value;
        const kampus_ids = Array.from(document.querySelectorAll(".chk-kampus:checked")).map((c) => Number(c.value));

        if (role === "admin" && kampus_ids.length === 0) {
          msg.innerHTML = `<div class="msg msg-error">Pilih minimal 1 kampus untuk akun Admin.</div>`;
          return;
        }

        const payload = {
          username: document.getElementById("u-username").value.trim(),
          password: document.getElementById("u-password").value,
          nama: document.getElementById("u-nama").value.trim(),
          role,
          kampus_ids: role === "admin" ? kampus_ids : undefined,
        };
        try {
          await api("/api/users", { method: "POST", body: JSON.stringify(payload) });
          msg.innerHTML = `<div class="msg msg-ok">Akun baru dibuat.</div>`;
          document.getElementById("form-akun").reset();
          renderPilihKampus();
          toggleKampusWrap();
          muatAkun();
        } catch (err) {
          msg.innerHTML = `<div class="msg msg-error">${err.message}</div>`;
        }
      });

      muatAkun();
    })();
  </script>
</body>
</html>
