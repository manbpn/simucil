<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan — Sistem Absensi Madrasah</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h1>Laporan</h1>
        <p>Rekap kehadiran siswa harian maupun bulanan.</p>
      </div>

      <div class="card">
        <h2>Rekap harian</h2>
        <div class="card-toolbar">
          <div class="field">
            <label for="h-tanggal">Tanggal</label>
            <input type="date" id="h-tanggal" />
          </div>
          <div class="field">
            <label for="h-kelas">Kelas</label>
            <select id="h-kelas"><option value="">Semua kelas</option></select>
          </div>
          <button class="btn btn-outline" id="btn-harian">Tampilkan</button>
          <button class="btn btn-gold" id="btn-export-harian">Export CSV</button>
        </div>
        <div class="stat-grid" id="ringkasan-harian"></div>
        <div id="tabel-harian"></div>
      </div>

      <div class="card">
        <h2>Rekap bulanan</h2>
        <div class="card-toolbar">
          <div class="field">
            <label for="b-bulan">Bulan</label>
            <select id="b-bulan"></select>
          </div>
          <div class="field">
            <label for="b-tahun">Tahun</label>
            <input type="number" id="b-tahun" style="width:100px;" />
          </div>
          <div class="field">
            <label for="b-kelas">Kelas</label>
            <select id="b-kelas"><option value="">Semua kelas</option></select>
          </div>
          <button class="btn btn-outline" id="btn-bulanan">Tampilkan</button>
          <button class="btn btn-gold" id="btn-export-bulanan">Export CSV</button>
        </div>
        <div id="tabel-bulanan"></div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const NAMA_BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    let dataHarianTerakhir = [];
    let dataBulananTerakhir = [];

    function downloadCsv(filename, headers, rows) {
      const csv = [headers.join(",")]
        .concat(rows.map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")))
        .join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function tampilkanHarian() {
      const tanggal = document.getElementById("h-tanggal").value;
      const kelasId = document.getElementById("h-kelas").value;
      if (!tanggal) return;
      let url = `/api/laporan/harian?tanggal=${tanggal}`;
      if (kelasId) url += `&kelas_id=${kelasId}`;
      const { rows, ringkasan } = await api(url);
      dataHarianTerakhir = rows;

      document.getElementById("ringkasan-harian").innerHTML = Object.entries(ringkasan)
        .map(([k, v]) => `<div class="stat-tile"><div class="label">${k}</div><div class="value">${v}</div></div>`)
        .join("");

      const wrap = document.getElementById("tabel-harian");
      if (rows.length === 0) {
        wrap.innerHTML = `<div class="empty-state">Tidak ada data untuk tanggal ini.</div>`;
        return;
      }

      const waLinks = await Promise.all(
        rows.map(async (r) => {
          if (!r.status) return null;
          const pesan = await buatPesanWa(r.kampus_id, {
            nama_ortu: r.nama_ortu,
            nama: r.nama,
            status: r.status,
            tanggal,
            nama_kelas: r.nama_kelas,
            keterangan: r.keterangan,
          });
          return buatLinkWa(r.nomor_wa_ortu, pesan);
        })
      );

      wrap.innerHTML = `
        <table>
          <thead><tr><th>NIS</th><th>Nama</th><th>Kampus</th><th>Kelas</th><th>Status</th><th>Keterangan</th><th></th></tr></thead>
          <tbody>
            ${rows
              .map((r, idx) => {
                const waLink = waLinks[idx];
                return `<tr>
                  <td>${r.nis}</td><td>${r.nama}</td><td>${r.nama_kampus}</td><td>${r.nama_kelas}</td>
                  <td>${badgeStatus(r.status)}</td><td>${r.keterangan || "-"}</td>
                  <td>${
                    waLink
                      ? `<a href="${waLink}" target="_blank" class="btn btn-wa" style="padding:5px 12px; font-size:12.5px; text-decoration:none;">Kirim WA</a>`
                      : `<button class="btn btn-wa" disabled style="padding:5px 12px; font-size:12.5px;">Kirim WA</button>`
                  }</td>
                </tr>`;
              })
              .join("")}
          </tbody>
        </table>`;
    }

    async function tampilkanBulanan() {
      const bulan = document.getElementById("b-bulan").value;
      const tahun = document.getElementById("b-tahun").value;
      const kelasId = document.getElementById("b-kelas").value;
      let url = `/api/laporan/bulanan?bulan=${bulan}&tahun=${tahun}`;
      if (kelasId) url += `&kelas_id=${kelasId}`;
      const rows = await api(url);
      dataBulananTerakhir = rows;

      const wrap = document.getElementById("tabel-bulanan");
      if (rows.length === 0) {
        wrap.innerHTML = `<div class="empty-state">Tidak ada data untuk bulan ini.</div>`;
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead><tr><th>NIS</th><th>Nama</th><th>Kampus</th><th>Kelas</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>Terisi</th></tr></thead>
          <tbody>
            ${rows
              .map(
                (r) => `<tr><td>${r.nis}</td><td>${r.nama}</td><td>${r.nama_kampus}</td><td>${r.nama_kelas}</td><td>${r.hadir}</td><td>${r.sakit}</td><td>${r.izin}</td><td>${r.alpa}</td><td>${r.total_dicatat} hari</td></tr>`
              )
              .join("")}
          </tbody>
        </table>`;
    }

    (async () => {
      const me = await initShell("/app/laporan.html");
      if (!me) return;

      if (me.role === "guru_piket") {
        document.querySelector(".main").innerHTML =
          '<div class="msg msg-error">Halaman laporan lengkap khusus untuk Admin dan Super Admin. Guru piket dapat melihat status absensi hari ini melalui halaman Ringkasan atau Input Absensi.</div>';
        return;
      }

      const kelasList = await api("/api/kelas");
      const optKelas = kelasList.map((k) => `<option value="${k.id}">${k.nama_kelas}</option>`).join("");
      document.getElementById("h-kelas").insertAdjacentHTML("beforeend", optKelas);
      document.getElementById("b-kelas").insertAdjacentHTML("beforeend", optKelas);

      const now = new Date();
      document.getElementById("h-tanggal").value = now.toISOString().slice(0, 10);
      document.getElementById("b-tahun").value = now.getFullYear();
      document.getElementById("b-bulan").innerHTML = NAMA_BULAN
        .map((n, i) => `<option value="${i + 1}" ${i + 1 === now.getMonth() + 1 ? "selected" : ""}>${n}</option>`)
        .join("");

      document.getElementById("btn-harian").addEventListener("click", tampilkanHarian);
      document.getElementById("btn-bulanan").addEventListener("click", tampilkanBulanan);

      document.getElementById("btn-export-harian").addEventListener("click", () => {
        if (dataHarianTerakhir.length === 0) return;
        downloadCsv(
          `absensi-harian-${document.getElementById("h-tanggal").value}.csv`,
          ["NIS", "Nama", "Kelas", "Status", "Keterangan"],
          dataHarianTerakhir.map((r) => [r.nis, r.nama, r.nama_kelas, r.status || "Belum dicatat", r.keterangan || ""])
        );
      });

      document.getElementById("btn-export-bulanan").addEventListener("click", () => {
        if (dataBulananTerakhir.length === 0) return;
        downloadCsv(
          `absensi-bulanan-${document.getElementById("b-tahun").value}-${document.getElementById("b-bulan").value}.csv`,
          ["NIS", "Nama", "Kelas", "Hadir", "Sakit", "Izin", "Alpa", "Hari Terisi"],
          dataBulananTerakhir.map((r) => [r.nis, r.nama, r.nama_kelas, r.hadir, r.sakit, r.izin, r.alpa, r.total_dicatat])
        );
      });

      await tampilkanHarian();
      await tampilkanBulanan();
    })();
  </script>
</body>
</html>
