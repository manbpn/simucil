<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Absensi — Sistem Absensi Madrasah</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h1>Input Absensi</h1>
        <p>Catat kehadiran siswa per kelas untuk tanggal tertentu.</p>
      </div>

      <div class="card">
        <div class="card-toolbar">
          <div class="field">
            <label for="f-kelas">Kelas</label>
            <select id="f-kelas"></select>
          </div>
          <div class="field">
            <label for="f-tanggal">Tanggal</label>
            <input type="date" id="f-tanggal" />
          </div>
          <button class="btn btn-outline" id="btn-muat">Muat data</button>
          <button class="btn btn-gold" id="btn-semua-hadir">Tandai semua hadir</button>
        </div>

        <div id="msg"></div>
        <div id="tabel-wrap"></div>

        <div style="margin-top:16px;">
          <button class="btn btn-primary" id="btn-simpan" disabled>Simpan absensi</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let daftarSiswa = [];
    let kelasTerpilihNama = "";
    let kampusTerpilihId = null;

    async function renderTabel() {
      const wrap = document.getElementById("tabel-wrap");
      if (daftarSiswa.length === 0) {
        wrap.innerHTML = `<div class="empty-state">Pilih kelas dan tanggal, lalu klik "Muat data".</div>`;
        document.getElementById("btn-simpan").disabled = true;
        return;
      }
      const statuses = ["Hadir", "Sakit", "Izin", "Alpa", "Terlambat"];
      const tanggal = document.getElementById("f-tanggal").value;

      // Susun tautan WA secara paralel (async) untuk siswa yang sudah punya status
      const waLinks = await Promise.all(
        daftarSiswa.map(async (s) => {
          if (!s.status) return null;
          const pesan = await buatPesanWa(kampusTerpilihId, {
            nama_ortu: s.nama_ortu,
            nama: s.nama,
            status: s.status,
            tanggal,
            nama_kelas: kelasTerpilihNama,
            keterangan: s.keterangan,
          });
          return buatLinkWa(s.nomor_wa_ortu, pesan);
        })
      );

      const rows = daftarSiswa
        .map((s, idx) => {
          const waLink = waLinks[idx];
          return `
        <tr>
          <td>${s.nis}</td>
          <td>${s.nama}</td>
          <td>
            <div class="status-picker" data-idx="${idx}">
              ${statuses
                .map(
                  (st) =>
                    `<button type="button" class="sel-${st} ${s.status === st ? "selected" : ""}" data-status="${st}">${st}</button>`
                )
                .join("")}
            </div>
          </td>
          <td><input type="text" class="ket-input" data-idx="${idx}" value="${s.keterangan || ""}" placeholder="Opsional" style="width:100%; padding:6px 9px; border:1px solid var(--line); border-radius:6px;" /></td>
          <td>
            ${
              waLink
                ? `<a href="${waLink}" target="_blank" class="btn btn-wa" style="padding:5px 12px; font-size:12.5px; text-decoration:none;">Kirim WA</a>`
                : `<button class="btn btn-wa" disabled style="padding:5px 12px; font-size:12.5px;" title="${s.nomor_wa_ortu ? 'Pilih status dulu' : 'No. WA belum diisi'}">Kirim WA</button>`
            }
          </td>
        </tr>`;
        })
        .join("");

      wrap.innerHTML = `
        <table>
          <thead><tr><th>NIS</th><th>Nama</th><th>Status</th><th>Keterangan</th><th>Info Ortu</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;

      wrap.querySelectorAll(".status-picker button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.parentElement.dataset.idx);
          const status = btn.dataset.status;
          daftarSiswa[idx].status = status;
          renderTabel();
        });
      });

      wrap.querySelectorAll(".ket-input").forEach((inp) => {
        inp.addEventListener("input", () => {
          daftarSiswa[Number(inp.dataset.idx)].keterangan = inp.value;
        });
      });

      document.getElementById("btn-simpan").disabled = false;
    }

    async function muatData() {
      const selectKelas = document.getElementById("f-kelas");
      const kelasId = selectKelas.value;
      const tanggal = document.getElementById("f-tanggal").value;
      const msg = document.getElementById("msg");
      msg.innerHTML = "";
      if (!kelasId || !tanggal) {
        msg.innerHTML = `<div class="msg msg-error">Pilih kelas dan tanggal terlebih dahulu.</div>`;
        return;
      }
      const opt = selectKelas.options[selectKelas.selectedIndex];
      kelasTerpilihNama = opt?.text || "";
      kampusTerpilihId = opt?.dataset.kampusId || null;

      daftarSiswa = await api(`/api/absensi?kelas_id=${kelasId}&tanggal=${tanggal}`);
      if (daftarSiswa.length === 0) {
        document.getElementById("tabel-wrap").innerHTML = `<div class="empty-state">Belum ada siswa aktif di kelas ini.</div>`;
        document.getElementById("btn-simpan").disabled = true;
        return;
      }
      renderTabel();
    }

    (async () => {
      const me = await initShell("/app/absensi.html");
      if (!me) return;

      document.getElementById("f-tanggal").value = new Date().toISOString().slice(0, 10);

      const kelasList = await api("/api/kelas");
      document.getElementById("f-kelas").innerHTML =
        `<option value="">Pilih kelas</option>` +
        kelasList
          .map((k) => `<option value="${k.id}" data-kampus-id="${k.kampus_id}">${k.nama_kelas} — ${k.nama_kampus}</option>`)
          .join("");

      document.getElementById("btn-muat").addEventListener("click", muatData);

      document.getElementById("btn-semua-hadir").addEventListener("click", () => {
        if (daftarSiswa.length === 0) return;
        daftarSiswa = daftarSiswa.map((s) => ({ ...s, status: "Hadir" }));
        renderTabel();
      });

      document.getElementById("btn-simpan").addEventListener("click", async () => {
        const msg = document.getElementById("msg");
        const tanggal = document.getElementById("f-tanggal").value;
        const tanpaStatus = daftarSiswa.some((s) => !s.status);
        if (tanpaStatus) {
          msg.innerHTML = `<div class="msg msg-error">Masih ada siswa yang belum diberi status kehadiran.</div>`;
          return;
        }
        try {
          const records = daftarSiswa.map((s) => ({
            siswa_id: s.siswa_id,
            status: s.status,
            keterangan: s.keterangan || null,
          }));
          const r = await api("/api/absensi", {
            method: "POST",
            body: JSON.stringify({ tanggal, records }),
          });
          msg.innerHTML = `<div class="msg msg-ok">Absensi tersimpan untuk ${r.jumlah} siswa.</div>`;
        } catch (err) {
          msg.innerHTML = `<div class="msg msg-error">${err.message}</div>`;
        }
      });
    })();
  </script>
</body>
</html>
