<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Sistem Absensi Madrasah</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">Al-Hikmah</div>
      <div class="sub">Sistem Absensi Madrasah</div>

      <div id="msg"></div>

      <form id="form-login">
        <div class="field">
          <label for="username">Nama pengguna</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Kata sandi</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary">Masuk</button>
      </form>

      <div class="hint">
        Akun contoh — Super Admin: <strong>superadmin</strong> / <strong>superadmin123</strong><br />
        Admin Kampus 1 &amp; 3: <strong>adminkampus1</strong> / <strong>admin123</strong><br />
        Admin Kampus 2: <strong>adminkampus2</strong> / <strong>admin123</strong><br />
        Guru Piket: <strong>gurupiket</strong> / <strong>piket123</strong>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async () => {
      // Jika sudah login, langsung ke dashboard
      try {
        const r = await fetch("/api/auth/me");
        if (r.ok) window.location.href = "/app/dashboard.html";
      } catch (e) {}
    })();

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.innerHTML = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      try {
        await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ username, password }),
        });
        window.location.href = "/app/dashboard.html";
      } catch (err) {
        msg.innerHTML = `<div class="msg msg-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
