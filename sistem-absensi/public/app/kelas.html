<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Kelas — Sistem Absensi Madrasah</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h1>Data Kelas</h1>
        <p>Kelola daftar kelas dan wali kelas.</p>
      </div>

      <div class="card">
        <h2 id="form-title">Tambah kelas</h2>
        <div id="msg"></div>
        <form id="form-kelas" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
          <input type="hidden" id="k-id" />
          <div class="field">
            <label for="k-nama">Nama kelas</label>
            <input type="text" id="k-nama" placeholder="Contoh: VII A" required />
          </div>
          <div class="field">
            <label for="k-tingkat">Tingkat</label>
            <input type="text" id="k-tingkat" placeholder="Contoh: VII" />
          </div>
          <div class="field">
            <label for="k-wali">Wali kelas</label>
            <input type="text" id="k-wali" style="min-width:200px;" />
          </div>
          <div class="field">
            <label for="k-kampus">Kampus</label>
            <select id="k-kampus" required></select>
          </div>
          <button type="submit" class="btn btn-primary">Simpan</button>
          <button type="button" class="btn btn-outline" id="btn-batal" style="display:none;">Batal</button>
        </form>
      </div>

      <div class="card">
        <h2>Daftar kelas</h2>
        <div id="tabel-kelas"></div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function muatKelas() {
      const rows = await api("/api/kelas");
      const wrap = document.getElementById("tabel-kelas");
      if (rows.length === 0) {
        wrap.innerHTML = `<div class="empty-state">Belum ada kelas terdaftar.</div>`;
        return;
      }
      wrap.innerHTML = `
        <table>
          <thead><tr><th>Nama Kelas</th><th>Kampus</th><th>Tingkat</th><th>Wali Kelas</th><th>Jumlah Siswa</th><th></th></tr></thead>
          <tbody>
            ${rows
              .map(
                (k) => `<tr>
                  <td>${k.nama_kelas}</td>
                  <td>${k.nama_kampus}</td>
                  <td>${k.tingkat || "-"}</td>
                  <td>${k.wali_kelas || "-"}</td>
                  <td>${k.jumlah_siswa}</td>
                  <td style="display:flex; gap:6px;">
                    <button class="btn btn-outline" data-edit='${JSON.stringify(k)}' style="padding:5px 10px; font-size:12.5px;">Ubah</button>
                    <button class="btn btn-danger" data-hapus="${k.id}" style="padding:5px 10px; font-size:12.5px;">Hapus</button>
                  </td>
                </tr>`
              )
              .join("")}
          </tbody>
        </table>`;

      wrap.querySelectorAll("[data-edit]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const k = JSON.parse(btn.dataset.edit);
          document.getElementById("form-title").textContent = "Ubah kelas";
          document.getElementById("k-id").value = k.id;
          document.getElementById("k-nama").value = k.nama_kelas;
          document.getElementById("k-tingkat").value = k.tingkat || "";
          document.getElementById("k-wali").value = k.wali_kelas || "";
          document.getElementById("k-kampus").value = k.kampus_id;
          document.getElementById("btn-batal").style.display = "inline-flex";
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      wrap.querySelectorAll("[data-hapus]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Hapus kelas ini? Semua siswa di dalamnya akan ikut terhapus.")) return;
          await api(`/api/kelas/${btn.dataset.hapus}`, { method: "DELETE" });
          muatKelas();
        });
      });
    }

    function resetForm() {
      document.getElementById("form-title").textContent = "Tambah kelas";
      document.getElementById("form-kelas").reset();
      document.getElementById("k-id").value = "";
      document.getElementById("btn-batal").style.display = "none";
    }

    (async () => {
      const me = await initShell("/app/kelas.html");
      if (!me) return;

      const kampusList = await api("/api/kampus");
      document.getElementById("k-kampus").innerHTML = kampusList
        .map((k) => `<option value="${k.id}">${k.nama_kampus}</option>`)
        .join("");

      document.getElementById("btn-batal").addEventListener("click", resetForm);

      document.getElementById("form-kelas").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        msg.innerHTML = "";
        const id = document.getElementById("k-id").value;
        const payload = {
          nama_kelas: document.getElementById("k-nama").value.trim(),
          tingkat: document.getElementById("k-tingkat").value.trim(),
          wali_kelas: document.getElementById("k-wali").value.trim(),
          kampus_id: document.getElementById("k-kampus").value,
        };
        try {
          if (id) {
            await api(`/api/kelas/${id}`, { method: "PUT", body: JSON.stringify(payload) });
            msg.innerHTML = `<div class="msg msg-ok">Data kelas diperbarui.</div>`;
          } else {
            await api("/api/kelas", { method: "POST", body: JSON.stringify(payload) });
            msg.innerHTML = `<div class="msg msg-ok">Kelas baru ditambahkan.</div>`;
          }
          resetForm();
          muatKelas();
        } catch (err) {
          msg.innerHTML = `<div class="msg msg-error">${err.message}</div>`;
        }
      });

      muatKelas();
    })();
  </script>
</body>
</html>
