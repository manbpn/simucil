<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadwal Piket — Sistem Absensi Madrasah</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h1>Jadwal Piket</h1>
        <p id="page-sub">Tetapkan guru piket bertugas di kampus mana pada tanggal tertentu.</p>
      </div>

      <div class="card" id="form-card" style="display:none;">
        <h2>Tambah jadwal piket</h2>
        <div id="msg"></div>
        <form id="form-piket" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
          <div class="field">
            <label for="p-guru">Guru piket</label>
            <select id="p-guru" required style="min-width:220px;"></select>
          </div>
          <div class="field">
            <label for="p-kampus">Kampus</label>
            <select id="p-kampus" required></select>
          </div>
          <div class="field">
            <label for="p-tanggal">Tanggal</label>
            <input type="date" id="p-tanggal" required />
          </div>
          <button type="submit" class="btn btn-primary">Tambahkan</button>
        </form>
        <p style="font-size:12.5px; color:#8A9793; margin-top:12px; margin-bottom:0;">
          Belum ada akun bertipe Guru Piket? Buat dulu lewat menu
          <a href="/app/akun.html" style="color:var(--teal); font-weight:600;">Akun Pengguna</a>.
        </p>
      </div>

      <div class="card">
        <h2 id="tabel-title">Jadwal piket</h2>
        <div class="card-toolbar">
          <div class="field">
            <label for="f-tanggal">Filter tanggal</label>
            <input type="date" id="f-tanggal" />
          </div>
          <button class="btn btn-outline" id="btn-filter">Tampilkan</button>
          <button class="btn btn-outline" id="btn-semua">Tampilkan semua</button>
        </div>
        <div id="tabel-piket"></div>
      </div>
    </main>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let peranSaya = null;

    async function muatPiket(tanggal) {
      const url = tanggal ? `/api/piket?tanggal=${tanggal}` : "/api/piket";
      const rows = await api(url);
      const wrap = document.getElementById("tabel-piket");
      if (rows.length === 0) {
        wrap.innerHTML = `<div class="empty-state">Tidak ada jadwal piket untuk ditampilkan.</div>`;
        return;
      }
      const bisaHapus = peranSaya === "admin" || peranSaya === "super_admin";
      wrap.innerHTML = `
        <table>
          <thead><tr><th>Tanggal</th><th>Guru Piket</th><th>Kampus</th>${bisaHapus ? "<th></th>" : ""}</tr></thead>
          <tbody>
            ${rows
              .map(
                (p) => `<tr>
                  <td>${fmtTanggal(p.tanggal)}</td>
                  <td>${p.nama_guru}</td>
                  <td>${p.nama_kampus}</td>
                  ${bisaHapus ? `<td><button class="btn btn-danger" data-hapus="${p.id}" style="padding:5px 10px; font-size:12.5px;">Hapus</button></td>` : ""}
                </tr>`
              )
              .join("")}
          </tbody>
        </table>`;

      if (bisaHapus) {
        wrap.querySelectorAll("[data-hapus]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("Hapus jadwal piket ini?")) return;
            await api(`/api/piket/${btn.dataset.hapus}`, { method: "DELETE" });
            muatPiket(document.getElementById("f-tanggal").value || null);
          });
        });
      }
    }

    (async () => {
      const me = await initShell("/app/piket.html");
      if (!me) return;
      peranSaya = me.role;

      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("f-tanggal").value = today;

      if (me.role === "guru_piket") {
        document.getElementById("page-sub").textContent = "Jadwal tugas piket Anda.";
        document.getElementById("tabel-title").textContent = "Jadwal piket saya";
      } else {
        document.getElementById("form-card").style.display = "block";
        document.getElementById("p-tanggal").value = today;

        const [guruList, kampusList] = await Promise.all([
          api("/api/users/guru-piket"),
          api("/api/kampus"),
        ]);

        document.getElementById("p-guru").innerHTML = guruList.length
          ? guruList.map((g) => `<option value="${g.id}">${g.nama} (${g.username})</option>`).join("")
          : `<option value="">Belum ada akun guru piket</option>`;
        document.getElementById("p-kampus").innerHTML = kampusList
          .map((k) => `<option value="${k.id}">${k.nama_kampus}</option>`)
          .join("");

        document.getElementById("form-piket").addEventListener("submit", async (e) => {
          e.preventDefault();
          const msg = document.getElementById("msg");
          msg.innerHTML = "";
          const payload = {
            user_id: document.getElementById("p-guru").value,
            kampus_id: document.getElementById("p-kampus").value,
            tanggal: document.getElementById("p-tanggal").value,
          };
          if (!payload.user_id) {
            msg.innerHTML = `<div class="msg msg-error">Buat akun guru piket terlebih dahulu.</div>`;
            return;
          }
          try {
            await api("/api/piket", { method: "POST", body: JSON.stringify(payload) });
            msg.innerHTML = `<div class="msg msg-ok">Jadwal piket ditambahkan.</div>`;
            muatPiket(document.getElementById("f-tanggal").value || null);
          } catch (err) {
            msg.innerHTML = `<div class="msg msg-error">${err.message}</div>`;
          }
        });
      }

      document.getElementById("btn-filter").addEventListener("click", () => {
        muatPiket(document.getElementById("f-tanggal").value);
      });
      document.getElementById("btn-semua").addEventListener("click", () => {
        document.getElementById("f-tanggal").value = "";
        muatPiket(null);
      });

      muatPiket(today);
    })();
  </script>
</body>
</html>
